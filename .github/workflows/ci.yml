name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: go test
        run: go test ./... -race -coverprofile=coverage.out
      - name: tygo drift check
        run: make test-types-gen
